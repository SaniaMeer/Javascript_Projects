<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Movie Search</h1>

        <div class="search-box">
            <input id="movie-input" type="text" placeholder="Enter movie name...">
            <button id="search-btn">Search</button>
        </div>

        <div id="movie-card" class="movie-card">

            <img id="movie-poster" src="https://via.placeholder.com/250x350" alt="Movie Poster">

            <div class="movie-info">

                <h2 id="movie-title">Movie Title</h2>

                <p class="rating"><strong>Rating: ⭐</strong> <span id="movie-rating">8.5</span></p>

                <p><strong>Year:</strong> <span id="movie-year">2024</span></p>

                <p><strong>Genre:</strong> <span id="movie-genre">Action, Sci-Fi</span></p>

                <p><strong>Actors:</strong> <span id="movie-actors">Actor Name</span></p>

                <p id="movie-plot" class="plot">
                    This is where the movie description will appear.
                </p>

            </div>

        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
